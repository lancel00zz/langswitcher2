name: Release app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Download tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip

      - name: Check branch and version
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::The tagged commit must be on main."
            exit 1
          }

          VERSION=$(python -c 'from version import __version__; print(__version__)')

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match version.py: v$VERSION"
            exit 1
          fi

      - name: Install spell-check library
        run: brew install enchant

      - name: Install Python and build dependencies
        run: |
          python -m pip install -r requirements.txt \
            "setuptools==80.3.1" "py2app==0.28.10" "modulegraph==0.19.7"

      - name: Build the app
        run: |
          LANGSWITCHER_BUILD_TIME=$(TZ=Europe/Paris date "+%Y%m%d.%H%M")
          sed -i '' "s/^__build__ = \"[^\"]*\"/__build__ = \"$LANGSWITCHER_BUILD_TIME\"/" version.py
          python setup.py py2app

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/LangSwitcher.app

      - name: Package the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/LangSwitcher.app" \
            "dist/LangSwitcher-${GITHUB_REF_NAME}-macOS-arm64.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/LangSwitcher-${GITHUB_REF_NAME}-macOS-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LangSwitcher $GITHUB_REF_NAME" \
            --generate-notes
